global:
  scrape_interval: 10s

scrape_configs:
  # Observer running inside compose (`--profile observer`).
  - job_name: flashmevlensr
    static_configs:
      - targets: ["observer:9464"]

  # Observer running on the host (`make follow`). host.docker.internal is the
  # docker0 bridge address on Linux, which `make follow` binds by default (see
  # LISTEN in the Makefile); never 0.0.0.0, which exposes pprof to the LAN.
  - job_name: flashmevlensr-host
    static_configs:
      - targets: ["host.docker.internal:9464"]
