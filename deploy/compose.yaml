# Local stack: ClickHouse (analytics), VictoriaMetrics (metrics), Grafana (dashboards)
# and the observatory itself. Everything is free/OSS and fits on one machine.
#
#   export CLICKHOUSE_PASSWORD=... CLICKHOUSE_GRAFANA_PASSWORD=... GRAFANA_ADMIN_PASSWORD=...
#   docker compose -f deploy/compose.yaml up -d
#
# (Or keep the variables in a git-ignored deploy/.env and pass --env-file.)
name: mevlens

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8-alpine
    environment:
      CLICKHOUSE_DB: mevlens
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-mevlens}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
      # Password of the read-only `grafana` user (clickhouse/users.d/grafana.xml).
      CLICKHOUSE_GRAFANA_PASSWORD: ${CLICKHOUSE_GRAFANA_PASSWORD:?set CLICKHOUSE_GRAFANA_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000" # native protocol (the observer)
      - "127.0.0.1:8123:8123" # HTTP (clickhouse-client, ad-hoc queries)
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # A single file: the entrypoint writes the observer's user into users.d too.
      - ./clickhouse/users.d/grafana.xml:/etc/clickhouse-server/users.d/grafana.xml:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.153.0
    command:
      - -promscrape.config=/etc/victoriametrics/scrape.yaml
      - -retentionPeriod=90d
      - -httpListenAddr=:8428
    ports:
      - "127.0.0.1:8428:8428"
    volumes:
      - ./victoriametrics/scrape.yaml:/etc/victoriametrics/scrape.yaml:ro
      - vm-data:/victoria-metrics-data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana-oss:13.0.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource # installed before Grafana serves requests
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Read-only ClickHouse user: dashboard editors must not be able to write.
      CLICKHOUSE_GRAFANA_PASSWORD: ${CLICKHOUSE_GRAFANA_PASSWORD:?set CLICKHOUSE_GRAFANA_PASSWORD}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      clickhouse:
        condition: service_healthy

  observer:
    profiles: ["observer"] # opt-in: `docker compose --profile observer up -d`
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["follow", "-config", "/etc/mevlens/arbitrum-one.toml", "-listen", "0.0.0.0:9464"]
    environment:
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-mevlens}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ports:
      - "127.0.0.1:9464:9464"
    volumes:
      - ../configs:/etc/mevlens:ro
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

volumes:
  clickhouse-data:
  vm-data:
  grafana-data:
