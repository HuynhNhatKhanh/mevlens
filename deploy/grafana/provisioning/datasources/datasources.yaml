apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      prometheusType: Prometheus
      timeInterval: 10s # the scrape interval, for $__rate_interval

  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    jsonData:
      implementation: prometheus

  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      username: grafana # read-only (deploy/clickhouse/users.d/grafana.xml)
      defaultDatabase: mevlens
    secureJsonData:
      password: ${CLICKHOUSE_GRAFANA_PASSWORD}
