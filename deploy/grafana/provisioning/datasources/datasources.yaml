apiVersion: 1

datasources:
  - name: VictoriaMetrics
    uid: victoriametrics
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true

  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      username: grafana # read-only (deploy/clickhouse/users.d/grafana.xml)
      defaultDatabase: mevlens
    secureJsonData:
      password: ${CLICKHOUSE_GRAFANA_PASSWORD}
