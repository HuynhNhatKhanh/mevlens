# MEVLens observatory — Arbitrum One.
#
# Every address below was verified on-chain on 2026-10-08 (factory pair counts /
# tick spacings, token decimals). Values like ${NAME} are read from the environment.

[chain]
name = "arbitrum-one"
chain_id = 42161

[rpc]
max_batch = 50
timeout = "15s"
max_attempts = 5

# Free public endpoints, used round-robin with per-endpoint rate limits.
# Add a keyed provider (Alchemy, QuickNode, ...) with url = "${ARB_RPC_URL}".
[[rpc.endpoints]]
name = "arbitrum-foundation"
url = "https://arb1.arbitrum.io/rpc"
rps = 4

[[rpc.endpoints]]
name = "publicnode"
url = "https://arbitrum-one-rpc.publicnode.com"
rps = 4

[[rpc.endpoints]]
name = "drpc"
url = "https://arbitrum.drpc.org"
rps = 4

[[rpc.endpoints]]
name = "meowrpc"
url = "https://arbitrum.meowrpc.com"
rps = 4

# Canonical factories. A v2/v3 pool counts only if its factory maps its tokens
# back to it; a v4 pool only if it was initialized by the configured PoolManager.
[[dex.factories]]
name = "uniswap-v2"
kind = "v2"
address = "0xf1D7CC64Fb4452F05c498126312eBE29f30Fbcf9"

[[dex.factories]]
name = "sushi-v2"
kind = "v2"
address = "0xc35DADB65012eC5796536bD9864eD8773aBc74C4"

[[dex.factories]]
name = "camelot-v2"
kind = "v2"
address = "0x6EcCab422D763aC031210895C81787E87B43A652"

[[dex.factories]]
name = "uniswap-v3"
kind = "v3"
address = "0x1F98431c8aD98523631AE4a59f267346ea31F984"

[[dex.factories]]
name = "sushi-v3"
kind = "v3"
address = "0x1af415a1EbA07a4986a52B6f2e7dE7003D82231e"

# Uniswap v4 singleton PoolManager. start_block is the first Initialize log on
# Arbitrum One (verified 2026-10-08); pools are indexed from there once at startup.
[[dex.factories]]
name = "uniswap-v4"
kind = "v4"
address = "0x360E68faCcca8cA495c1B759Fd9EEe466db9FB32"
start_block = 298076243

[pricing]
weth = "0x82aF49447D8a07e3bd95BD0d56f35241523fBab1"
# ETH/USD comes from uniswap-v3 getPool(WETH, USDC, 500), resolved at startup.
reference_factory = "uniswap-v3"
reference_stable = "0xaf88d065e77c8cC2239327C5EDb3A432268e5831"
reference_fee = 500

[[pricing.stables]]
symbol = "USDC"
address = "0xaf88d065e77c8cC2239327C5EDb3A432268e5831"
decimals = 6

[[pricing.stables]]
symbol = "USDC.e"
address = "0xFF970A61A04b1cA14834A43f5dE4533eBDDB5CC8"
decimals = 6

[[pricing.stables]]
symbol = "USDT"
address = "0xFd086bC7CD5C481DCC9C85ebE478A1C0b69FCbb9"
decimals = 6

[[pricing.stables]]
symbol = "DAI"
address = "0xDA10009cBd5D07dd0CeCc66161FC93D7c9000da1"
decimals = 18

[regime]
# 0 = not yet verified on-chain. Find them with `mevlens regime` (see README):
# the first and last blocks containing timeboosted transactions.
timeboost_start_block = 0
pga_start_block = 0

[pipeline]
fetch_workers = 4
poll_interval = "250ms"
flush_blocks = 100
flush_interval = "2s"
reorg_depth = 64

[clickhouse]
addr = "${CLICKHOUSE_ADDR}"
database = "mevlens"
username = "${CLICKHOUSE_USER}"
password = "${CLICKHOUSE_PASSWORD}"

[telemetry]
listen = "127.0.0.1:9464"
log_level = "info"
log_format = "json"
flight_recorder = true
slow_block_threshold = "2s"
